<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support – Smart Baseball</title>
<meta name="description" content="Get help with the Smart Baseball app.">
<style>
  :root {
    --bg: #faf7f0; --surface: #ffffff; --text: #1c2333; --muted: #5a6274;
    --accent: #c8102e; --navy: #13294b; --border: #e4ded0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151f; --surface: #182031; --text: #e8ebf2; --muted: #9aa3b5;
      --accent: #ff4d5e; --navy: #8fb3ff; --border: #273249;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header { border-bottom: 1px solid var(--border); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; color: var(--navy); text-decoration: none; font-size: 1.1rem; }
  .brand span { color: var(--accent); }
  nav .links a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: .95rem; }
  nav .links a:first-child { margin-left: 0; }
  nav .links a:hover { color: var(--text); }
  main { padding: 40px 0 60px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; color: var(--navy); }
  h2 { font-size: 1.25rem; margin: 36px 0 10px; color: var(--navy); }
  p { margin: 0 0 14px; }
  .lead { color: var(--muted); font-size: 1.08rem; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 20px 22px; margin: 24px 0;
  }
  .card p:last-child { margin-bottom: 0; }
  .email { font-size: 1.15rem; font-weight: 600; color: var(--accent); word-break: break-all; }
  details { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin: 10px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details p { margin: 10px 0 0; color: var(--muted); }
  ul { padding-left: 22px; margin: 0 0 14px; }
  a { color: var(--accent); }
  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; padding: 22px 0 40px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="brand" href="./">Smart <span>Baseball</span></a>
      <div class="links">
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy</a>
      </div>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Support</h1>
  <p>Reach out to <a href="mailto:smartbaseballadmin@gmail.com">smartbaseballadmin@gmail.com</a>.</p>
</main>

<footer>
  <div class="wrap">© 2026 Smart Baseball · <a href="privacy.html">Privacy Policy</a></div>
</footer>
</body>
</html>
