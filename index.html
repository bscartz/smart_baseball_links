<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Baseball</title>
<meta name="description" content="Smart Baseball: a game logging tool focused on player development.">
<style>
  :root {
    --bg: #faf7f0; --surface: #ffffff; --text: #1c2333; --muted: #5a6274;
    --accent: #c8102e; --navy: #13294b; --border: #e4ded0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151f; --surface: #182031; --text: #e8ebf2; --muted: #9aa3b5;
      --accent: #ff4d5e; --navy: #8fb3ff; --border: #273249;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  main { padding: 80px 0 60px; }
  h1 { font-size: 2.6rem; line-height: 1.1; margin: 0 0 16px; color: var(--navy); }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); font-size: 1.15rem; max-width: 560px; }
  .buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .btn {
    display: inline-block; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; padding: 22px 0 40px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main class="wrap">
  <h1>Smart <span>Baseball</span></h1>
  <p class="lead">A game logging tool focused on player development, not stats. Track what actually drives improvement, like contact quality, and give players and coaches a shared place to talk about growth.</p>
  <div class="buttons">
    <a class="btn primary" href="support.html">Get Support</a>
    <a class="btn" href="privacy.html">Privacy Policy</a>
  </div>
</main>
<footer>
  <div class="wrap">© 2026 Smart Baseball · <a href="mailto:smartbaseballadmin@gmail.com">smartbaseballadmin@gmail.com</a></div>
</footer>
</body>
</html>
